name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet restore F1.slnx --locked-mode
      - run: dotnet build F1.slnx -c Release --no-restore -m:1 -p:UseSharedCompilation=false
      - run: dotnet tests/F1.Tests/bin/Release/net10.0-windows/F1.Tests.dll
      - run: node --test pi-package/test/*.test.mjs
      - run: node scripts/check-public.mjs
      - run: npm install --prefix artifacts/pi-test @earendil-works/pi-coding-agent@0.85.1
      - run: node scripts/pi-smoke.mjs artifacts/pi-test/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js
      - run: node scripts/backend-smoke.mjs artifacts/pi-test/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js
      - run: dotnet tests/F1.Tests/bin/Release/net10.0-windows/F1.Tests.dll --render artifacts/overlay.png
      - run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: F1-win-x64
          path: artifacts/F1-win-x64.zip
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: "dummyLicense"
